OpenIDE-Module-Display-Category=Ingest Module
OpenIDE-Module-Long-Description=\
    Looks for AI-generation provenance indicators in image files (selection of files based on file signatures): \
    embedded generator parameters (Stable Diffusion, ComfyUI, InvokeAI, NovelAI), IPTC/XMP AI source-type markers, \
    generator names in EXIF/XMP/PNG text, and the presence of C2PA manifests (not validated). \
    Images with indicators are tagged as Interesting Items in evidence bands. \
    Optional OpenCV-DNN classifier (ONNX model) and descriptive pixel statistics. This is triage, not proof of authorship.
OpenIDE-Module-Name=AIImageDetect4Autopsy
OpenIDE-Module-Short-Description=Flags images carrying AI-generation provenance indicators.

AiImageDetectIngestModuleFactory.moduleName=AIImageDetect4Autopsy
AiImageDetectIngestModuleFactory.moduleDescription=Looks for AI-generation provenance indicators (generator parameters, AI source-type markers, generator names, C2PA presence) in JPG, PNG, WebP, GIF, BMP & TIFF files and tags them in evidence bands. Triage only: absence of indicators does not mean an image is human-made.
